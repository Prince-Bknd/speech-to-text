<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <h1>Settings</h1>
  
  <label>AI Provider (for Summarization)</label>
  <select id="aiProvider">
    <option value="openai">OpenAI (GPT-4o-mini)</option>
    <option value="anthropic">Anthropic (Claude 3.5 Haiku)</option>
    <option value="google">Google (Gemini 1.5 Flash)</option>
  </select>

  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="sk-...">
  <p style="font-size: 0.8em; color: #666; margin-top: 5px;">
    <span id="keyHint">OpenAI keys start with sk-</span>
  </p>

  <label>Language (for Transcription)</label>
  <select id="language">
    <option value="en">English</option><option value="hi">Hindi</option><option value="es">Spanish</option>
    <option value="fr">French</option><option value="de">German</option><option value="ja">Japanese</option>
    <option value="ko">Korean</option><option value="zh">Chinese</option><option value="pt">Portuguese</option>
    <option value="it">Italian</option>
  </select>
  
  <label class="checkbox-label"><input type="checkbox" id="darkMode"> Enable Dark Mode</label>
  
  <button id="saveBtn">Save Settings</button>
  <p id="status" class="status"></p>
  <script src="settings.js"></script>
</body>
</html>
