<!DOCTYPE html>
<html>
<head>
  <title>History</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; background: #f9f9f9; }
    .history-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: white; }
    .meta { color: #666; font-size: 0.9em; margin-bottom: 10px; }
    .text { max-height: 100px; overflow: hidden; text-overflow: ellipsis; white-space: pre-wrap; }
    button { margin-right: 10px; padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; }
    .download { background: #007bff; color: white; }
    .delete { background: #dc3545; color: white; }
    #clearAll { background: #dc3545; color: white; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Transcript History</h1>
  <button id="clearAll">Clear All History</button>
  <div id="historyList"></div>
</body>
</html>
